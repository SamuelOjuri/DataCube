[build]
base = "web"
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
Cache-Control = "no-store"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
# CSP is generated into dist/_headers with the exact VITE_API_ORIGIN at build time.
# Nonproduction Netlify builds must explicitly match the build-only STAGING_API_ORIGIN.
