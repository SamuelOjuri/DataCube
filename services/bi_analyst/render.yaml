# Deploy this Blueprint explicitly. It does not alter the existing ETL services.
services:
  - type: web
    name: datacube-bi-analyst
    runtime: python
    rootDir: services/bi_analyst
    buildCommand: pip install -r requirements.lock && pip install --no-deps --no-build-isolation .
    startCommand: uvicorn bi_analyst.api:application --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers --timeout-keep-alive 5 --limit-concurrency 32
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BI_ANALYST_ENVIRONMENT
        value: production
      - key: BI_ANALYST_READ_DSN
        sync: false
      - key: BI_ANALYST_STATE_DSN
        sync: false
      - key: BI_ANALYST_CORS_ORIGINS
        sync: false
      - key: BI_ANALYST_CONNECTION_BUDGET
        value: 4
      - key: BI_ANALYST_REPLICA_COUNT
        value: 1
      - key: BI_ANALYST_READ_POOL_SIZE
        value: 2
      - key: BI_ANALYST_STATE_POOL_SIZE
        value: 2
