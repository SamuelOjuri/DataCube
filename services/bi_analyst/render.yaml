# Deploy this Blueprint explicitly. It does not alter the existing ETL services.
services:
  - type: web
    name: datacube-bi-analyst
    runtime: python
    rootDir: services/bi_analyst
    buildCommand: pip install -r requirements.lock && pip install --no-deps --no-build-isolation .
    startCommand: uvicorn bi_analyst.api:application --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers --timeout-keep-alive 5 --timeout-graceful-shutdown 20 --limit-concurrency 32
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BI_ANALYST_ENVIRONMENT
        value: production
      - key: BI_ANALYST_ANALYST_ENABLED
        value: "false"
      - key: BI_ANALYST_PILOT_ONLY
        value: "true"
      - key: BI_ANALYST_PILOT_SUBJECTS
        sync: false
      - key: BI_ANALYST_DISABLED_METRICS
        value: ""
      - key: BI_ANALYST_TELEMETRY_TOKEN
        sync: false
      - key: BI_ANALYST_READ_DSN
        sync: false
      - key: BI_ANALYST_STATE_DSN
        sync: false
      - key: BI_ANALYST_CORS_ORIGINS
        sync: false
      - key: BI_ANALYST_AUTH_PROVIDER
        value: disabled
      - key: BI_ANALYST_MONDAY_CLIENT_ID
        sync: false
      - key: BI_ANALYST_MONDAY_CLIENT_SECRET
        sync: false
      - key: BI_ANALYST_MONDAY_ACCOUNT_ID
        sync: false
      - key: BI_ANALYST_MONDAY_REDIRECT_URI
        sync: false
      - key: BI_ANALYST_AUTH_FRONTEND_URL
        sync: false
      - key: BI_ANALYST_SESSION_SECONDS
        value: 900
      - key: BI_ANALYST_CONNECTION_BUDGET
        value: 8
      - key: BI_ANALYST_DEPLOYMENT_OVERLAP
        value: 2
      - key: BI_ANALYST_REPLICA_COUNT
        value: 1
      - key: BI_ANALYST_READ_POOL_SIZE
        value: 2
      - key: BI_ANALYST_STATE_POOL_SIZE
        value: 2
      - key: BI_ANALYST_METRIC_EVALUATION_ENABLED
        value: "false"
      - key: BI_ANALYST_METRIC_MAX_ROWS
        value: 1000
      - key: BI_ANALYST_METRIC_MAX_BYTES
        value: 900000
      - key: BI_ANALYST_METRIC_CONCURRENCY
        value: 2
      - key: BI_ANALYST_METRIC_TIMEOUT_SECONDS
        value: 15
      - key: BI_ANALYST_BUSINESS_TIMEZONE
        value: Europe/London
      - key: BI_ANALYST_MONDAY_READ_TOKEN
        sync: false
      - key: BI_ANALYST_MONDAY_READ_API_VERSION
        value: "2026-07"
      - key: BI_ANALYST_WORKFLOW_ENABLED
        value: "false"
      - key: BI_ANALYST_GEMINI_API_KEY
        sync: false
      - key: BI_ANALYST_WORKFLOW_CONCURRENCY
        value: 2
      - key: BI_ANALYST_WORKFLOW_TIMEOUT_SECONDS
        value: 90
      - key: BI_ANALYST_WORKFLOW_MAX_MODEL_CALLS
        value: 8
      - key: BI_ANALYST_MODEL_TIMEOUT_SECONDS
        value: 25
