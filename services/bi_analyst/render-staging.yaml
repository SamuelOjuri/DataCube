# First deployment: supply only the two TEST DSNs and upload supabase-test.cer.
# DSNs use sslmode=verify-full and sslrootcert=/etc/secrets/supabase-test.cer.
# Add frontend, Monday, Gemini and pilot settings later; see docs/bi-analyst-phase7.md.
services:
  - type: web
    name: datacube-bi-analyst-staging
    runtime: python
    rootDir: services/bi_analyst
    buildCommand: pip install -r requirements.lock && pip install --no-deps --no-build-isolation .
    startCommand: bi-analyst-preflight && exec uvicorn bi_analyst.api:application --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers --timeout-keep-alive 5 --timeout-graceful-shutdown 20 --limit-concurrency 32
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - {key: PYTHON_VERSION, value: 3.13.5}
      - {key: BI_ANALYST_ENVIRONMENT, value: staging}
      - {key: BI_ANALYST_ANALYST_ENABLED, value: "false"}
      - {key: BI_ANALYST_WORKFLOW_ENABLED, value: "false"}
      - {key: BI_ANALYST_AUTH_PROVIDER, value: disabled}
      - {key: BI_ANALYST_PILOT_ONLY, value: "true"}
      - {key: BI_ANALYST_READ_DSN, sync: false}
      - {key: BI_ANALYST_STATE_DSN, sync: false}
      - {key: BI_ANALYST_TELEMETRY_TOKEN, generateValue: true}
      - {key: BI_ANALYST_CONNECTION_BUDGET, value: 8}
      - {key: BI_ANALYST_DEPLOYMENT_OVERLAP, value: 2}
      - {key: BI_ANALYST_REPLICA_COUNT, value: 1}
      - {key: BI_ANALYST_READ_POOL_SIZE, value: 2}
      - {key: BI_ANALYST_STATE_POOL_SIZE, value: 2}
      - {key: BI_ANALYST_METRIC_CONCURRENCY, value: 2}
      - {key: BI_ANALYST_WORKFLOW_CONCURRENCY, value: 2}
      - {key: BI_ANALYST_METRIC_EVALUATION_ENABLED, value: "false"}
      - {key: BI_ANALYST_BUSINESS_TIMEZONE, value: Europe/London}
