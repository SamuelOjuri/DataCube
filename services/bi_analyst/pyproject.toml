[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datacube-bi-analyst"
version = "0.6.0"
description = "Isolated DataCube analyst API and analytical contracts (no ETL startup)"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.11.7", "psycopg[binary]==3.2.12", "psycopg-pool==3.2.8",
    "tzdata==2025.2", "fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1",
    "langgraph==1.2.14", "langgraph-checkpoint-postgres==3.1.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "python-dotenv==1.1.1", "httpx==0.28.1"]

[project.scripts]
bi-catalogue = "bi_analyst.semantic.check:main"

[tool.setuptools.packages.find]
include = ["bi_analyst*"]

[tool.setuptools.package-data]
"bi_analyst" = ["permissions.sql", "permissions_auth.sql", "permissions_workflow.sql", "permissions_presentation.sql"]
"bi_analyst.semantic" = ["catalogue.json", "acceptance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: isolated loopback PostgreSQL tests"]
